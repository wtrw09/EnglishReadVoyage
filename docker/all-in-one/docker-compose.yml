name: englishread

services:
  app:
    # 镜像来源（根据实际情况选择其一）：
    # - 本地镜像: image: englishreadvoyage:latest（需先通过 build.ps1 构建）
    # - CNB 镜像: image: docker.cnb.cool/wtrw09/englishreadvoyage:latest（首次自动拉取，需先 docker login）
    image: docker.cnb.cool/wtrw09/englishreadvoyage:latest
    container_name: englishread
    ports:
      - "8888:80"
    volumes:
      # 数据目录（包含 data.db、ecdict.db、merriam_webster_cache.db 和 word_audio 缓存）
      - ./backend/data:/app/data
      # 书籍目录
      - ./backend/Books:/app/Books
      # 预编译缓存目录（书籍解析结果缓存，重启后保留）
      - ./backend/.cache:/app/.cache
    # 所有环境变量直接在此设置，无需外部 .env 文件
    # SECRET_KEY 不设置时 entrypoint 自动生成临时密钥（重启后需重新登录）
    # ACCESS_TOKEN_EXPIRE_MINUTES 代码默认 10800 分钟，这里设为 7 天
    environment:
      - DEBUG=False
      - IS_PRODUCTION=True
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      # SECRET_KEY: 取消注释并重启容器即可使用固定密钥（避免重启后需重新登录）
      # - SECRET_KEY=dv_9BtcjZADGK5fn3zCLvswWnuA1ggrs7H3bHWsV734
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/dictionary/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
