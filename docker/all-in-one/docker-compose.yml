name: englishread

services:
  app:
    image: englishread-all-in-one:latest
    container_name: englishread
    ports:
      - "8888:80"
    volumes:
      # 数据目录（包含 data.db、ecdict.db、merriam_webster_cache.db 和 word_audio 缓存）
      - ./backend/data:/app/data
      # 书籍目录
      - ./backend/Books:/app/Books
      # 预编译缓存目录（书籍解析结果缓存，重启后保留）
      - ./backend/.cache:/app/.cache
    # 直接设置环境变量（无需外部 .env 文件）
    environment:
      - DEBUG=False
      - IS_PRODUCTION=True
      # SECRET_KEY 可在执行目录的 .env 文件中设置（docker compose 自动读取），或由 entrypoint 自动生成
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/dictionary/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
