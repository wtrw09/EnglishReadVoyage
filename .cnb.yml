# CNB 云原生构建配置文件
# 文档：https://docs.cnb.cool/zh/build/
#
# 使用说明：
# - 分平台构建镜像（amd64 + arm64），最后合并为 manifest list
# - 最终镜像标签统一为: latest
# - 拉取时会自动选择对应架构的镜像
# - 使用默认的 docker driver（而非 docker-container driver），
#   避免 QEMU 模拟架构下 RUN 指令因 capabilities 限制失败的问题

main:
  push:
    - services:
        - docker
      stages:
        # 设置镜像标签
        - name: set docker tag
          script: |
            echo -n "${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest"
          exports:
            info: IMAGE_TAG

        # 构建并推送 amd64 镜像
        - name: build and push amd64
          script: |
            docker buildx build \
              --platform linux/amd64 \
              --tag ${IMAGE_TAG}-amd64 \
              --file docker/all-in-one/Dockerfile \
              --build-arg PYTHON_IMAGE=python:3.13-slim \
              --build-arg NODE_IMAGE=node:22-alpine \
              --push \
              .

        # 构建并推送 arm64 镜像
        - name: build and push arm64
          script: |
            docker buildx build \
              --platform linux/arm64 \
              --tag ${IMAGE_TAG}-arm64 \
              --file docker/all-in-one/Dockerfile \
              --build-arg PYTHON_IMAGE=python:3.13-slim \
              --build-arg NODE_IMAGE=node:22-alpine \
              --push \
              .

        # 合并为多架构 manifest（指向 latest）
        - name: create multi-arch manifest
          script: |
            docker buildx imagetools create \
              --tag ${IMAGE_TAG} \
              ${IMAGE_TAG}-amd64 \
              ${IMAGE_TAG}-arm64
